        .boxes::before{

            color: purple;
        }

        .boxes::after{
            
            content: "Ankit is Cool Guy😎";
            color: darkgoldenrod;
        }
        ::selection{
            background-color: grey;
            color: yellow; 
        }
        .box::first-letter{
            color: darkcyan;
            font-size:  45px;
        }
        input::placeholder{
            color: red;

<body>
    <div class="boxes">
        <div data-color="primary" class="box">Hey I am Ankit</div>
        <div class="box">Hey I am Ankit</div>
        <div class="box">Hey I am Ankit</div>
        <input type="text" placeholder="Type your name here">
