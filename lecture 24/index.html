<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Overflow Property</title>
    <style>
        .box{
            width: 30vw;
            height: 40dvh;
            border: 2px solid black;
            overflow: auto;
            overflow-x: hidden;
            overflow-y: scroll;
            /* white-space: nowrap; */
            /* text-overflow: ellipsis; */
        }

    </style>
</head>
<body>
   <div class="box">
    I am a boy and I love to write Lorem ipsum dolor, sit amet consectetur adipisicing elit. Iure atque illum eius facere corporis labore sint corrupti velit dolorem at praesentium, cum quisquam sunt? Dolorem esse alias velit nihil aperiam!
   </div>
</body>
</html>
