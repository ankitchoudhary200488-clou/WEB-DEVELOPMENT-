<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form - Lets learn it</title>
    </head>
    <body>
        <h1>Form To Apply For Sigma Web Development Course - TA</h1>
        <form action="post">
            <div>
                <label for="username">Enter you name </label> 
                <input type="text" id="username" name="username" placeholder=" Enter your name here" autofocus required>
            </div>
            <div>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>
            <div>
                <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                <label for="subscribe">Subscribe to newsletter</label>
            </div>
            <div>
                <label for="comment">Enter your Comment</label>
                <br>
                <textarea id="comment" name="comment" rows="4" cols="50" placeholder="Enter your comment here"></textarea> 
            </div>
            <div>
                <select name="Fruit">
                    <option value="apple">Apple</option>
                    <option value="banana">Banana</option>
                    <option value="orange">Orange</option>
                    <option value="grape">Grape</option>
                </select>
            </div>
        </form>
    </body>
</html>
