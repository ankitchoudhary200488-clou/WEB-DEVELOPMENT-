<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 5px 5px #088808;
        }
        P{
            text-shadow: 7px 7px 7px #099809;
            outline: 2px solid rgb(243, 30, 172);
            border: 2px solid rgb(23, 236, 23);
            border-radius: 17px;
            outline-offset: 14px;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <P>
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Nemo veritatis iste molestias, illo repellendus est iusto consequuntur non laboriosam enim itaque sapiente quae aut velit repudiandae mollitia dolorem dignissimos culpa magni asperiores.
    </P>
    
</body>
</html>
