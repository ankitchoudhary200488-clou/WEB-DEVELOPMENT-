<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sizing Units</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            box-sizing: border-box;
            border: 2px solid black;
            /* width: 2048px; */
            width: 80vw;
            height: 10vh;
            margin: 23px auto;
            background-color: aquamarine;
            

        }
        html{
            font-size: 12px;
        }
        
        .container{
            box-sizing: border-box;
            border: 2px solid black;
            /* width: 2048px; */
            width: 80vw;
            height: 80vh;
            margin: 23px auto;
            /* font-size: 18px; */
            background-color: aquamarine;

        }
        .container > div{
            font-size: 2em;
            border: 2px solid red;
            width: 50%;
        }
        .container >div  > div{
            border: 2px solid blue;
            width: 50%;
        }

      .mycront{
        box-sizing: border-box;
        border: 2px solid black;
        /* background-color: red; */
        color: black;
        /* width: 80vmin; */
        margin:  23px auto;
        width: 80vw;
      }
    </style>
</head>
<body>
    <span class="box">
     This is a box
    </span>
    <div class="container">
       <div>
           Lorem, ipsum dolor sit amet consectetur adipisicing elit. Maiores, itaque? At est illum, nostrum a, fugit id earum perferendis laboriosam asperiores doloribus 
        <div>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Deleniti porro temporibus iusto.
        </div>
    </div>
    </div>
    
    <div class="mycront">
        I am Another box
    </div>
</body>
</html>
